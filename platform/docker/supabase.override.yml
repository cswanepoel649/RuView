# Platform adjustments to the vendored Supabase stack (supabase/docker-compose.yml).
# Merged by the `include:` in ../docker-compose.yml — keep upstream files untouched.
services:
  auth:
    environment:
      # Invite/recovery links must use the token-hash flow handled by /auth/confirm.
      GOTRUE_MAILER_TEMPLATES_INVITE: http://web:3000/email-templates/invite.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://web:3000/email-templates/recovery.html
      GOTRUE_MAILER_SUBJECTS_INVITE: "You have been invited to RuView Monitoring"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Reset your RuView Monitoring password"
      GOTRUE_PASSWORD_MIN_LENGTH: "12"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"

  # Keep the Postgres pooler ports on this machine only (official file binds all interfaces).
  # Not used by the platform: opt in with `--profile extras` (supavisor publishes Postgres on 127.0.0.1:5432).
  supavisor:
    profiles: [extras]
    ports: !override
      - 127.0.0.1:${POSTGRES_PORT}:5432
      - 127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543

  # Local mail catcher (same service the official dev overlay uses). SMTP_HOST=supabase-mail.
  # Web inbox: http://localhost:${MAIL_UI_PORT}. Replace with a real SMTP server in production.
  mail:
    container_name: supabase-mail
    image: inbucket/inbucket:3.0.3
    restart: unless-stopped
    networks:
      default:
        aliases: [supabase-mail]
    ports:
      - 127.0.0.1:${MAIL_UI_PORT:-9000}:9000

  # Edge Functions are not used by the platform — opt in with `--profile extras` (saves ~1 GB RAM).
  functions:
    profiles: [extras]
